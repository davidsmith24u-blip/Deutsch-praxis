<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — DeutschPraxis</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; }
    .card { text-align: center; padding: 2.5rem; }
    h1 { font-size: 1.5rem; margin: 0.5rem 0; }
    p { color: #64748b; margin: 0.5rem 0 1.5rem; }
    a { display: inline-block; background: #4f46e5; color: #fff; padding: 0.65rem 1.4rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem">📴</div>
    <h1>You're offline</h1>
    <p>Practice needs a connection, but your visited pages still work offline.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
